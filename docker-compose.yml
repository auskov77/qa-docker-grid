services:
  selenium-hub:
    image: selenium/hub:4.20.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
    networks:
      - qa-grid-network

  chrome:
    image: selenium/node-chrome:4.20.0
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    deploy:
      replicas: 3
    networks:
      - qa-grid-network

  # НОВЫЙ СЕРВИС: База данных
  postgres:
    image: postgres:16
    container_name: qa-postgres-jenkins
    environment:
      POSTGRES_PASSWORD: qa
      POSTGRES_USER: qa
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"  # <-- ВАЖНО: порт 5433, чтобы не конфликтовать с локальной БД (5432)
    networks:
      - qa-grid-network

networks:
  qa-grid-network:
    external: true